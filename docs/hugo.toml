[markup.tableOfContents]
startLevel = 2
endLevel = 3

[[menu.main]]
name = "Docs"
pageRef = "/docs"
weight = 1

[[menu.main]]
name = "Search"
weight = 2
[menu.main.params]
type = "search"

[[menu.main]]
name = "GitHub"
url = "https://github.com/alexraskin/swarmctl"
weight = 3
[menu.main.params]
icon = "github"

[params]
[params.navbar]
displayTitle = true
displayLogo = false

[params.page]
width = "normal"

[params.footer]
enable = true
displayCopyright = false
displayPoweredBy = false

[params.editURL]
enable = true
